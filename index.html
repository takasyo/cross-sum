<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>クロスサム候補</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #edf0ec;
        --surface: #ffffff;
        --surface-2: #f4f6f3;
        --ink: #182019;
        --muted: #5d6b60;
        --line: #d3dad2;
        --accent: #14684a;
        --accent-strong: #0d4f37;
        --accent-soft: #dcefe4;
        --accent-ink: #ffffff;
        --danger: #b3372c;
        --danger-soft: #fbe9e6;
        --warn-bg: #fdf1dc;
        --warn-ink: #7a4d08;
        --tile-bg: #ffffff;
        --tile-line: #2a332c;
        --dim: #c3ccc3;
        --shadow: 0 1px 2px rgba(20, 32, 24, 0.06), 0 8px 24px rgba(20, 32, 24, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111511;
          --surface: #1b211c;
          --surface-2: #232a24;
          --ink: #edf3ee;
          --muted: #a3b3a6;
          --line: #333d35;
          --accent: #3fae7c;
          --accent-strong: #5cc48f;
          --accent-soft: #1e3a2c;
          --accent-ink: #0c1710;
          --danger: #ff9a8c;
          --danger-soft: #41241f;
          --warn-bg: #3d2f14;
          --warn-ink: #f2c877;
          --tile-bg: #262e27;
          --tile-line: #5a685d;
          --dim: #3a443c;
          --shadow: none;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
        font-feature-settings: "tnum" 1;
        line-height: 1.55;
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .wrap { max-width: 680px; margin: 0 auto; padding: 16px 14px 40px; }

      .lead { margin: 4px 2px 14px; font-size: 15px; color: var(--muted); }
      .lead strong { color: var(--ink); }

      .presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 2px 16px; }
      .presets .label { font-size: 13px; color: var(--muted); font-weight: 700; }
      .preset-btn {
        min-height: 38px; padding: 6px 14px;
        border: 1px solid var(--line); border-radius: 999px;
        background: var(--surface); font-size: 13.5px; font-weight: 500;
      }
      .preset-btn:active { background: var(--accent-soft); }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 18px 16px 20px;
        margin-bottom: 14px;
      }
      .card h2 {
        margin: 0 0 4px; font-size: 17px; font-weight: 900; letter-spacing: 0.02em;
        display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      }
      .card h2 .sub { font-size: 12.5px; font-weight: 500; color: var(--muted); }
      .field-label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 0 8px; }
      .field-label:first-of-type { margin-top: 8px; }

      /* マス数 */
      .n-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
      .n-btn {
        min-height: 46px; border-radius: 10px;
        border: 1.5px solid var(--line); background: var(--surface-2);
        font-size: 17px; font-weight: 700;
      }
      .n-btn[aria-pressed="true"] {
        background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
      }

      /* 合計 */
      .sum-row { display: flex; align-items: stretch; gap: 8px; }
      .step-btn {
        width: 52px; min-height: 56px; flex: none;
        border-radius: 12px; border: 1.5px solid var(--line);
        background: var(--surface-2); font-size: 24px; font-weight: 700; line-height: 1;
      }
      .step-btn:active { background: var(--accent-soft); }
      .sum-input-wrap {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
        border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
        min-height: 56px; padding: 0 10px;
      }
      .sum-input-wrap input {
        width: 84px; border: none; background: transparent; text-align: center;
        font-size: 30px; font-weight: 900; outline: none; padding: 2px 0;
        -moz-appearance: textfield; appearance: textfield;
      }
      .sum-input-wrap input::-webkit-outer-spin-button,
      .sum-input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      .sum-unit { font-size: 14px; color: var(--muted); font-weight: 700; }
      input[type="range"] { width: 100%; margin: 12px 0 2px; accent-color: var(--accent); height: 32px; }
      .range-note { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
      .range-note strong { color: var(--accent-strong); }

      /* マスのタイル */
      .tiles { display: flex; gap: 5px; margin-top: 12px; }
      .tile {
        flex: 1 1 0; min-width: 0; min-height: 58px;
        border: 2px solid var(--tile-line); border-radius: 9px;
        background: var(--tile-bg); color: var(--ink);
        display: flex; align-items: center; justify-content: center;
        padding: 3px 2px; position: relative;
      }
      .tile .tile-num {
        position: absolute; top: 2px; left: 5px;
        font-size: 9.5px; font-weight: 700; color: var(--muted); line-height: 1;
      }
      .tile[data-selected="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 4px var(--accent);
      }
      .tile-big { font-size: 26px; font-weight: 900; line-height: 1.1; }
      .tile-small { font-size: 11.5px; font-weight: 700; line-height: 1.3; text-align: center; word-break: break-all; padding-top: 8px; }
      .tile-small.excl { color: var(--danger); }
      .tile-none { color: var(--dim); font-size: 18px; font-weight: 700; }
      .tile .tile-fixed-mark {
        position: absolute; bottom: 3px; right: 4px;
        font-size: 8.5px; font-weight: 900; color: var(--accent-strong); line-height: 1;
      }

      /* 編集パネル */
      .editor {
        margin-top: 14px; border: 1px solid var(--line); border-radius: 12px;
        background: var(--surface-2); padding: 12px;
      }
      .editor-title { font-size: 14px; font-weight: 900; margin: 0 0 10px; }
      .editor-title .accent { color: var(--accent-strong); }
      .mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .mode-btn {
        min-height: 42px; border-radius: 9px; padding: 4px 2px;
        border: 1.5px solid var(--line); background: var(--surface);
        font-size: 13.5px; font-weight: 700;
      }
      .mode-btn[aria-pressed="true"] {
        background: var(--ink); border-color: var(--ink); color: var(--bg);
      }
      .mode-desc { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; min-height: 1.4em; }
      .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 10px; }
      .pad-btn {
        min-height: 52px; border-radius: 11px;
        border: 1.5px solid var(--line); background: var(--surface);
        font-size: 21px; font-weight: 900;
      }
      .pad-btn[aria-pressed="true"] {
        background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
      }
      .pad-btn.excl-on {
        background: var(--danger-soft); border-color: var(--danger); color: var(--danger);
        text-decoration: line-through; text-decoration-thickness: 2px;
      }
      .pad-btn:disabled { opacity: 0.35; cursor: default; }
      .editor-actions { display: flex; gap: 8px; margin-top: 12px; }
      .ghost-btn {
        min-height: 42px; padding: 6px 14px; border-radius: 9px;
        border: 1.5px solid var(--line); background: var(--surface);
        font-size: 13.5px; font-weight: 700;
      }
      .kbd-hint { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
      @media (hover: none) { .kbd-hint { display: none; } }

      /* 結果 */
      .result-status { font-size: 15px; font-weight: 700; margin: 10px 0 0; }
      .result-status .count { color: var(--accent-strong); font-size: 19px; font-weight: 900; }
      .warn {
        margin-top: 12px; background: var(--warn-bg); color: var(--warn-ink);
        border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 500;
      }
      .warn ul { margin: 6px 0 0; padding-left: 18px; }
      .warn li { margin: 2px 0; }

      .cell-results { margin-top: 14px; display: grid; gap: 10px; }
      .cell-row {
        display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center;
        padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
      }
      .cell-row.decided { border-color: var(--accent); background: var(--accent-soft); }
      .cell-row-label { font-size: 13px; font-weight: 900; line-height: 1.35; }
      .cell-row-label .decided-badge {
        display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 900;
        color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 1px 8px;
      }
      @media (prefers-color-scheme: dark) {
        .cell-row-label .decided-badge { color: var(--accent-ink); }
      }
      .strip { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
      .strip span {
        display: flex; align-items: center; justify-content: center;
        height: 34px; border-radius: 7px; font-size: 15px; font-weight: 900;
        background: var(--accent); color: var(--accent-ink);
      }
      .strip span.off {
        background: var(--surface-2); color: var(--dim);
        border: 1px solid var(--line); font-weight: 500;
      }
      .strip span.fixed-in { box-shadow: inset 0 0 0 2px var(--ink); }

      .combo-head { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
      .combos { display: flex; flex-wrap: wrap; gap: 7px; }
      .combo {
        display: inline-flex; gap: 3px; align-items: center;
        border: 1px solid var(--line); border-radius: 9px; padding: 5px 7px; background: var(--surface-2);
      }
      .combo i {
        font-style: normal; display: inline-flex; align-items: center; justify-content: center;
        width: 23px; height: 23px; border-radius: 5px;
        background: var(--surface); border: 1px solid var(--line);
        font-size: 13.5px; font-weight: 900;
      }
      .combo i.common { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

      .footer-actions { display: flex; justify-content: center; margin-top: 4px; }
      .reset-btn {
        min-height: 46px; padding: 8px 22px; border-radius: 999px;
        border: 1.5px solid var(--line); background: var(--surface);
        font-size: 14px; font-weight: 700;
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }
      @media (max-width: 420px) {
        .cell-row { grid-template-columns: 54px 1fr; gap: 8px; padding: 9px 9px; }
        .strip span { height: 30px; font-size: 13.5px; }
        .tile { min-height: 52px; }
        .tile-big { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="lead">
        クロスサム（カックロ）の1つのカギについて、<strong>マスの数</strong>と<strong>合計</strong>を入れるだけで、
        各マスに入り得る数字をすべて絞り込みます。すでに分かっている数字や候補を入れると、その分だけさらに絞れます。
      </p>

      <div class="presets" aria-label="例">
        <span class="label">例：</span>
        <button type="button" class="preset-btn" data-preset="0">3マス・合計15・5が確定</button>
        <button type="button" class="preset-btn" data-preset="1">4マス・合計10</button>
        <button type="button" class="preset-btn" data-preset="2">2マス・合計17</button>
      </div>

      <!-- 基本条件 -->
      <section class="card" aria-labelledby="h-basic">
        <h2 id="h-basic">基本条件</h2>
        <p class="field-label" id="label-n">マスの数</p>
        <div class="n-grid" id="nGrid" role="group" aria-labelledby="label-n"></div>

        <p class="field-label" id="label-sum">合計</p>
        <div class="sum-row">
          <button type="button" class="step-btn" id="sumMinus" aria-label="合計を1減らす">−</button>
          <div class="sum-input-wrap">
            <input type="number" id="sumInput" inputmode="numeric" aria-labelledby="label-sum" />
            <span class="sum-unit">の合計</span>
          </div>
          <button type="button" class="step-btn" id="sumPlus" aria-label="合計を1増やす">＋</button>
        </div>
        <input type="range" id="sumRange" aria-label="合計（スライダー）" />
        <p class="range-note" id="rangeNote"></p>
      </section>

      <!-- マスの条件 -->
      <section class="card" aria-labelledby="h-cells">
        <h2 id="h-cells">各マスの条件 <span class="sub">マスをタップして選んでから数字を指定</span></h2>
        <div class="tiles" id="tiles" role="group" aria-label="マス一覧"></div>

        <div class="editor" aria-live="off">
          <p class="editor-title" id="editorTitle"></p>
          <div class="mode-grid" id="modeGrid" role="group" aria-label="指定の種類">
            <button type="button" class="mode-btn" data-mode="none">指定なし</button>
            <button type="button" class="mode-btn" data-mode="fixed">確定</button>
            <button type="button" class="mode-btn" data-mode="cand">候補</button>
            <button type="button" class="mode-btn" data-mode="excl">除外</button>
          </div>
          <p class="mode-desc" id="modeDesc"></p>
          <div class="pad" id="pad" role="group" aria-label="数字パッド"></div>
          <div class="editor-actions">
            <button type="button" class="ghost-btn" id="clearCell">このマスをクリア</button>
            <button type="button" class="ghost-btn" id="clearAllCells">全マスの条件をクリア</button>
          </div>
          <p class="kbd-hint">キーボード：←→でマス移動、1〜9で数字の指定、Deleteでクリア</p>
        </div>
      </section>

      <!-- 結果 -->
      <section class="card" aria-labelledby="h-result">
        <h2 id="h-result">絞り込み結果</h2>
        <p class="result-status" id="resultStatus" role="status"></p>
        <div id="warnBox"></div>
        <div class="cell-results" id="cellResults"></div>
        <p class="combo-head" id="comboHead"></p>
        <div class="combos" id="combos"></div>
      </section>

      <div class="footer-actions">
        <button type="button" class="reset-btn" id="resetAll">最初からやり直す</button>
      </div>
    </main>

    <script>
      "use strict";
      var DIGITS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

      function newCell() { return { type: "none", digits: [] }; }

      var state = {
        n: 3,
        sum: 15,
        cells: [],
        selected: 0
      };
      for (var i = 0; i < 9; i++) state.cells.push(newCell());

      var PRESETS = [
        { n: 3, sum: 15, cells: { 0: { type: "fixed", digits: [5] } } },
        { n: 4, sum: 10, cells: {} },
        { n: 2, sum: 17, cells: {} }
      ];

      function minSum(n) { var s = 0; for (var k = 1; k <= n; k++) s += k; return s; }
      function maxSum(n) { var s = 0; for (var k = 0; k < n; k++) s += 9 - k; return s; }

      function allowedSet(cell) {
        var s = new Set();
        var k, d;
        if (cell.type === "fixed" && cell.digits.length === 1) {
          s.add(cell.digits[0]);
        } else if (cell.type === "cand" && cell.digits.length > 0) {
          for (k = 0; k < cell.digits.length; k++) s.add(cell.digits[k]);
        } else if (cell.type === "excl" && cell.digits.length > 0) {
          for (k = 0; k < DIGITS.length; k++) {
            d = DIGITS[k];
            if (cell.digits.indexOf(d) === -1) s.add(d);
          }
        } else {
          for (k = 0; k < DIGITS.length; k++) s.add(DIGITS[k]);
        }
        return s;
      }

      /* 数字の組み合わせ（順序なし）をすべて列挙 */
      function enumerateCombos(n, sum) {
        var out = [];
        function rec(start, left, rest, cur) {
          if (left === 0) { if (rest === 0) out.push(cur.slice()); return; }
          for (var d = start; d <= 9; d++) {
            if (d > rest) break;
            cur.push(d);
            rec(d + 1, left - 1, rest - d, cur);
            cur.pop();
          }
        }
        rec(1, n, sum, []);
        return out;
      }

      /* 組み合わせごとに割り当てを全探索し、各マスに入り得る数字を集める */
      function solve() {
        var n = state.n;
        var allowed = [];
        for (var i = 0; i < n; i++) allowed.push(allowedSet(state.cells[i]));

        var combos = enumerateCombos(n, state.sum);
        var perCell = [];
        for (i = 0; i < n; i++) perCell.push(new Set());
        var feasibleCombos = [];

        combos.forEach(function (combo) {
          var comboSet = new Set(combo);
          /* この組み合わせの数字だけでは足りないマスがあれば不可 */
          var domains = allowed.map(function (a) {
            var d = [];
            a.forEach(function (v) { if (comboSet.has(v)) d.push(v); });
            return d;
          });
          var ok = domains.every(function (d) { return d.length > 0; });
          if (!ok) return;

          /* ドメインの小さいマスから割り当てる */
          var order = domains.map(function (d, idx) { return idx; })
            .sort(function (a, b) { return domains[a].length - domains[b].length; });
          var used = new Set();
          var assign = new Array(n);
          var found = false;

          function bt(pos) {
            if (pos === n) {
              found = true;
              for (var j = 0; j < n; j++) perCell[j].add(assign[j]);
              return;
            }
            var cellIdx = order[pos];
            var dom = domains[cellIdx];
            for (var t = 0; t < dom.length; t++) {
              var v = dom[t];
              if (used.has(v)) continue;
              used.add(v); assign[cellIdx] = v;
              bt(pos + 1);
              used.delete(v);
            }
          }
          bt(0);
          if (found) feasibleCombos.push(combo);
        });

        return { perCell: perCell, feasibleCombos: feasibleCombos, allCombos: combos };
      }

      function buildHints(result) {
        var hints = [];
        var n = state.n;
        if (state.sum < minSum(n) || state.sum > maxSum(n)) {
          hints.push("合計は " + minSum(n) + "〜" + maxSum(n) + " の範囲でないと作れません。");
        }
        var fixedSeen = {};
        for (var i = 0; i < n; i++) {
          var c = state.cells[i];
          if (c.type === "fixed" && c.digits.length === 1) {
            if (fixedSeen[c.digits[0]]) {
              hints.push("数字 " + c.digits[0] + " が2つのマスで確定しています（同じカギの中では数字は重複しません）。");
            }
            fixedSeen[c.digits[0]] = true;
          }
          if (allowedSet(c).size === 0) {
            hints.push((i + 1) + "マス目は入れる数字が残っていません。");
          }
        }
        if (result.allCombos.length > 0 && result.feasibleCombos.length === 0 && hints.length === 0) {
          hints.push("数字の組み合わせ自体はありますが、各マスの条件と両立する並べ方がありません。条件を少し緩めてみてください。");
        }
        if (result.allCombos.length === 0 && hints.length === 0) {
          hints.push("このマス数と合計では、重複なしの組み合わせが作れません。");
        }
        return hints;
      }

      /* ===== 描画 ===== */
      var el = function (id) { return document.getElementById(id); };
      var nGrid = el("nGrid"), tilesEl = el("tiles"), padEl = el("pad");
      var sumInput = el("sumInput"), sumRange = el("sumRange");

      /* マス数ボタン */
      [2, 3, 4, 5, 6, 7, 8, 9].forEach(function (n) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "n-btn"; b.textContent = n;
        b.setAttribute("aria-label", n + "マス");
        b.addEventListener("click", function () {
          state.n = n;
          if (state.selected >= n) state.selected = n - 1;
          var lo = minSum(n), hi = maxSum(n);
          if (state.sum < lo) state.sum = lo;
          if (state.sum > hi) state.sum = hi;
          render();
        });
        b.dataset.n = n;
        nGrid.appendChild(b);
      });

      /* 数字パッド */
      DIGITS.forEach(function (d) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "pad-btn"; b.textContent = d;
        b.dataset.digit = d;
        b.addEventListener("click", function () { tapDigit(d); });
        padEl.appendChild(b);
      });

      function setCellMode(mode) {
        var cell = state.cells[state.selected];
        if (mode === "none") { cell.type = "none"; cell.digits = []; }
        else if (mode === "fixed") {
          cell.type = "fixed";
          if (cell.digits.length > 1) cell.digits = [cell.digits[0]];
        } else {
          cell.type = mode;
        }
        render();
      }

      function tapDigit(d) {
        var cell = state.cells[state.selected];
        if (cell.type === "none") {
          cell.type = "fixed"; cell.digits = [d];
        } else if (cell.type === "fixed") {
          if (cell.digits.length === 1 && cell.digits[0] === d) {
            cell.type = "none"; cell.digits = [];
          } else {
            cell.digits = [d];
          }
        } else {
          var idx = cell.digits.indexOf(d);
          if (idx === -1) cell.digits.push(d); else cell.digits.splice(idx, 1);
          cell.digits.sort(function (a, b) { return a - b; });
        }
        render();
      }

      document.querySelectorAll(".mode-btn").forEach(function (b) {
        b.addEventListener("click", function () { setCellMode(b.dataset.mode); });
      });
      el("clearCell").addEventListener("click", function () { setCellMode("none"); });
      el("clearAllCells").addEventListener("click", function () {
        for (var i = 0; i < 9; i++) state.cells[i] = newCell();
        render();
      });
      el("resetAll").addEventListener("click", function () {
        state.n = 3; state.sum = 15; state.selected = 0;
        for (var i = 0; i < 9; i++) state.cells[i] = newCell();
        render();
      });
      document.querySelectorAll(".preset-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          var p = PRESETS[Number(b.dataset.preset)];
          state.n = p.n; state.sum = p.sum; state.selected = 0;
          for (var i = 0; i < 9; i++) state.cells[i] = newCell();
          Object.keys(p.cells).forEach(function (k) {
            state.cells[Number(k)] = { type: p.cells[k].type, digits: p.cells[k].digits.slice() };
          });
          render();
        });
      });

      el("sumMinus").addEventListener("click", function () { bumpSum(-1); });
      el("sumPlus").addEventListener("click", function () { bumpSum(1); });
      function bumpSum(delta) {
        var v = state.sum + delta;
        if (v < minSum(state.n)) v = minSum(state.n);
        if (v > maxSum(state.n)) v = maxSum(state.n);
        state.sum = v; render();
      }
      sumInput.addEventListener("change", function () {
        var v = parseInt(sumInput.value, 10);
        if (isNaN(v)) { render(); return; }
        if (v < 3) v = 3;
        if (v > 45) v = 45;
        state.sum = v; render();
      });
      sumRange.addEventListener("input", function () {
        state.sum = Number(sumRange.value); render();
      });

      document.addEventListener("keydown", function (e) {
        var tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (e.key >= "1" && e.key <= "9") { tapDigit(Number(e.key)); }
        else if (e.key === "ArrowRight") {
          state.selected = Math.min(state.n - 1, state.selected + 1); render();
        } else if (e.key === "ArrowLeft") {
          state.selected = Math.max(0, state.selected - 1); render();
        } else if (e.key === "Delete" || e.key === "Backspace") {
          setCellMode("none");
        }
      });

      var MODE_DESC = {
        none: "このマスには制限がありません。数字をタップすると「確定」になります。",
        fixed: "このマスに入る数字は1つに決まっています。もう一度タップすると解除されます。",
        cand: "このマスに入り得る数字をすべて選んでください（複数選択）。",
        excl: "このマスには絶対に入らない数字を選んでください（複数選択）。"
      };

      function tileContent(cell) {
        if (cell.type === "fixed" && cell.digits.length === 1) {
          return '<span class="tile-big">' + cell.digits[0] + '</span><span class="tile-fixed-mark">確定</span>';
        }
        if (cell.type === "cand" && cell.digits.length > 0) {
          return '<span class="tile-small">' + cell.digits.join(" ") + '</span>';
        }
        if (cell.type === "excl" && cell.digits.length > 0) {
          return '<span class="tile-small excl">≠' + cell.digits.join(",") + '</span>';
        }
        return '<span class="tile-none">–</span>';
      }

      function render() {
        /* マス数 */
        nGrid.querySelectorAll(".n-btn").forEach(function (b) {
          b.setAttribute("aria-pressed", Number(b.dataset.n) === state.n ? "true" : "false");
        });
        /* 合計 */
        sumInput.value = state.sum;
        sumRange.min = minSum(state.n);
        sumRange.max = maxSum(state.n);
        sumRange.value = state.sum;
        el("rangeNote").innerHTML =
          state.n + "マス・重複なしだと合計は <strong>" + minSum(state.n) + "〜" + maxSum(state.n) +
          "</strong> の範囲になります。";

        /* タイル */
        tilesEl.innerHTML = "";
        for (var i = 0; i < state.n; i++) {
          (function (idx) {
            var cell = state.cells[idx];
            var b = document.createElement("button");
            b.type = "button"; b.className = "tile";
            b.dataset.selected = idx === state.selected ? "true" : "false";
            b.setAttribute("aria-label", (idx + 1) + "マス目" + (idx === state.selected ? "（編集中）" : ""));
            b.innerHTML = '<span class="tile-num">' + (idx + 1) + "</span>" + tileContent(cell);
            b.addEventListener("click", function () { state.selected = idx; render(); });
            tilesEl.appendChild(b);
          })(i);
        }

        /* 編集パネル */
        var cell = state.cells[state.selected];
        el("editorTitle").innerHTML =
          '<span class="accent">' + (state.selected + 1) + "マス目</span> の条件";
        document.querySelectorAll(".mode-btn").forEach(function (b) {
          b.setAttribute("aria-pressed", b.dataset.mode === cell.type ? "true" : "false");
        });
        el("modeDesc").textContent = MODE_DESC[cell.type];
        padEl.querySelectorAll(".pad-btn").forEach(function (b) {
          var d = Number(b.dataset.digit);
          var on = cell.digits.indexOf(d) !== -1 && cell.type !== "none";
          b.setAttribute("aria-pressed", on ? "true" : "false");
          b.classList.toggle("excl-on", on && cell.type === "excl");
          b.disabled = false;
        });

        renderResult();
      }

      function renderResult() {
        var result = solve();
        var statusEl = el("resultStatus");
        var warnBox = el("warnBox");
        var cellResults = el("cellResults");
        var comboHead = el("comboHead");
        var combosEl = el("combos");
        warnBox.innerHTML = ""; cellResults.innerHTML = ""; combosEl.innerHTML = "";

        if (result.feasibleCombos.length === 0) {
          statusEl.textContent = "条件を満たす組み合わせがありません。";
          var hints = buildHints(result);
          if (hints.length) {
            var div = document.createElement("div");
            div.className = "warn";
            div.innerHTML = "確認ポイント<ul>" + hints.map(function (h) { return "<li>" + h + "</li>"; }).join("") + "</ul>";
            warnBox.appendChild(div);
          }
          comboHead.textContent = "";
          return;
        }

        statusEl.innerHTML =
          '数字の組み合わせは <span class="count">' + result.feasibleCombos.length + "</span> 通りです。";

        /* 各マスの候補 */
        for (var i = 0; i < state.n; i++) {
          (function (idx) {
            var set = result.perCell[idx];
            var row = document.createElement("div");
            row.className = "cell-row" + (set.size === 1 ? " decided" : "");
            var label = document.createElement("div");
            label.className = "cell-row-label";
            label.innerHTML = (idx + 1) + "マス目" +
              (set.size === 1 ? '<br /><span class="decided-badge">確定</span>' : "");
            var strip = document.createElement("div");
            strip.className = "strip";
            strip.setAttribute("aria-label", (idx + 1) + "マス目の候補：" +
              DIGITS.filter(function (d) { return set.has(d); }).join("、"));
            DIGITS.forEach(function (d) {
              var s = document.createElement("span");
              s.textContent = d;
              if (!set.has(d)) s.className = "off";
              var c = state.cells[idx];
              if (c.type === "fixed" && c.digits[0] === d) s.classList.add("fixed-in");
              strip.appendChild(s);
            });
            row.appendChild(label);
            row.appendChild(strip);
            cellResults.appendChild(row);
          })(i);
        }

        /* 組み合わせ一覧：全マス共通の数字は色付け */
        comboHead.textContent = "数字の組み合わせ一覧（色付きは、どの組み合わせにも必ず入る数字）";
        result.feasibleCombos.forEach(function (combo) {
          var span = document.createElement("span");
          span.className = "combo";
          combo.forEach(function (d) {
            var it = document.createElement("i");
            it.textContent = d;
            var inAll = result.feasibleCombos.every(function (c) { return c.indexOf(d) !== -1; });
            if (inAll) it.className = "common";
            span.appendChild(it);
          });
          combosEl.appendChild(span);
        });
      }

      render();
    </script>
  </body>
</html>
